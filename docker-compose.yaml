name: the-last-of-trust

networks:
  # Isolated out-of-band management network (BMC <-> Host QMP)
  oob-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.100.0.0/24

  # Management network (Verifier <-> Host Attestation Agent)
  mgmt-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.101.0.0/24

volumes:
  host-data:
  bmc-data:
  verifier-data:

services:
  # Measured-boot host VM (QEMU + EDK2 UEFI TPM2 + swtpm + Debian 12 + IMA)
  host:
    build:
      context: ./Dockerfiles/host
      dockerfile: Dockerfile
    container_name: tlot-host
    networks:
      oob-net:
        ipv4_address: 10.100.0.10
      mgmt-net:
        ipv4_address: 10.101.0.10
    volumes:
      - host-data:/var/lib/host
      - ./firmware:/firmware
      - ./logs/host:/logs
    ports:
      - "${HOST_SSH_PORT:-2222}:22"     # SSH into the Debian guest (user: lab / pass: lab)
      - "${HOST_AGENT_PORT:-8081}:8080" # Host TPM 2.0 & IMA attestation agent API
    environment:
      - VM_MEM=1536
      - VM_CPUS=2
      - DISK_SIZE=10G
    restart: unless-stopped

  # Out-of-band BMC controller (DMTF Redfish HTTPS API backed by Host QMP)
  bmc:
    build:
      context: ./Dockerfiles/bmc
      dockerfile: Dockerfile
    container_name: tlot-bmc
    networks:
      oob-net:
        ipv4_address: 10.100.0.20
      mgmt-net:
        ipv4_address: 10.101.0.20
    volumes:
      - bmc-data:/var/lib/bmc
      - ./firmware:/firmware:ro
      - ./logs/bmc:/logs
    ports:
      - "8443:443"    # Redfish HTTPS API (root:0penBmc)
    environment:
      - HOST_QMP_ADDR=10.100.0.10
      - HOST_QMP_PORT=4444
      - BMC_USER=root
      - BMC_PASS=0penBmc
    depends_on:
      - host
    restart: unless-stopped

  # TPM 2.0 Remote Attestation Verifier (cryptographic tpm2_checkquote + IMA diff)
  verifier:
    build:
      context: ./Dockerfiles/verifier
      dockerfile: Dockerfile
    container_name: tlot-verifier
    networks:
      mgmt-net:
        ipv4_address: 10.101.0.30
    volumes:
      - verifier-data:/var/lib/verifier
    ports:
      - "8888:8888"   # Verifier HTTP API
    environment:
      - HOST_AGENT_URL=http://10.101.0.10:8080
      - VERIFIER_PORT=8888
    depends_on:
      - host
    restart: unless-stopped
